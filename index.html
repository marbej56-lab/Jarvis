<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. SYSTEM INTERFACE</title>

    <!-- Corrected Stylesheet File Name -->
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDKs for Cloud Memory Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Eruda Console for iPad Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>

<body>

    <main class="interface">

        <!-- LEFT STATUS PANEL -->
        <section class="left-panel">

            <div class="panel-title">
                SYSTEM STATUS
            </div>

            <div class="current-status">
                <span class="status-dot"></span>
                <span id="modeText">PASSIVE</span>
            </div>

            <div class="mode-list">
                <div id="passiveMode" class="mode active">PASSIVE</div>
                <div id="listeningMode" class="mode">LISTENING</div>
                <div id="thinkingMode" class="mode">THINKING</div>
                <div id="speakingMode" class="mode">SPEAKING</div>
            </div>

            <div class="system-info">
                <div>
                    MICROPHONE
                    <span id="micStatus">ACTIVE</span>
                </div>

                <div>
                    CORE
                    <span>ONLINE</span>
                </div>

                <div>
                    AI
                    <span>ONLINE</span>
                </div>
            </div>

        </section>


        <!-- CENTER VISUALIZER -->
        <section class="center">

            <canvas id="sphere"></canvas>

            <div class="name">
                J.A.R.V.I.S.
            </div>

            <div id="transcript" class="transcript">
                System ready. Tap screen to activate voice core.
            </div>

        </section>


        <!-- RIGHT AI ACTIVITY LOG -->
        <section class="right-panel">

            <div class="panel-title">
                AI ACTIVITY
            </div>

            <div id="activity"></div>

        </section>

    </main>


    <!-- AUTHENTICATION MODAL -->
    <div id="apiModal" class="modal" style="display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: #111; padding: 25px; border: 1px solid #00d2ff; text-align: center; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); max-width: 320px; width: 90%;">
            <h3 style="color: #00d2ff; margin-top: 0; font-family: sans-serif;">SYSTEM AUTHENTICATION</h3>
            <p style="color: #ccc; font-size: 13px; font-family: sans-serif; margin-bottom: 15px;">Enter your Groq API key to activate core processing:</p>
            <input type="password" id="groqKeyInput" placeholder="gsk_..." style="padding: 10px; width: 85%; margin-bottom: 15px; border-radius: 4px; border: 1px solid #00d2ff; background: #000; color: #fff; text-align: center;" />
            <br>
            <button onclick="saveGroqKeyInline()" style="padding: 10px 20px; background: #00d2ff; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: sans-serif;">AUTHENTICATE</button>
        </div>
    </div>


    <!-- CORE HANDLERS & WORKER INTERFACE -->
    <script>
        // Check saved key on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('groq_api_key') || localStorage.getItem('jarvis_groq_key');
            if (savedKey) {
                const modal = document.getElementById('apiModal');
                if (modal) modal.style.display = 'none';
            }
        });

        // Key Authentication Handler
        function saveGroqKeyInline() {
            const keyInput = document.getElementById('groqKeyInput');
            const key = keyInput ? keyInput.value.trim() : '';

            if (key.length > 5) {
                localStorage.setItem('groq_api_key', key);
                localStorage.setItem('jarvis_groq_key', key);

                const modal = document.getElementById('apiModal');
                if (modal) modal.style.display = 'none';
                
                console.log('Key successfully persisted.');
            } else {
                alert('Please enter a valid API key (e.g., gsk_...)');
            }
        }

        // Send Prompt Request
        async function sendToAI(promptText) {
            const transcript = document.getElementById('transcript');
            const activity = document.getElementById('activity');
            const modeText = document.getElementById('modeText');
            const passiveMode = document.getElementById('passiveMode');
            const thinkingMode = document.getElementById('thinkingMode');

            if (!promptText || !promptText.trim()) return;

            // THINKING MODE
            if (modeText) modeText.innerText = 'THINKING';
            if (passiveMode) passiveMode.classList.remove('active');
            if (thinkingMode) thinkingMode.classList.add('active');
            if (transcript) transcript.innerText = 'Processing command...';

            if (activity) {
                const newLog = document.createElement('div');
                newLog.style.marginBottom = '8px';
                newLog.innerText = '> ' + promptText;
                activity.prepend(newLog);
            }

            try {
                const response = await fetch('https://jrv.marcbejjani456.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    if (transcript) transcript.innerText = aiText;

                    // Safari Utterance Engine Sync
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.resume();

                        const speech = new SpeechSynthesisUtterance(aiText);
                        speech.rate = 1;
                        speech.pitch = 1;

                        speech.onstart = function () {
                            if (modeText) modeText.innerText = 'SPEAKING';
                        };

                        speech.onend = function () {
                            if (modeText) modeText.innerText = 'PASSIVE';
                            if (thinkingMode) thinkingMode.classList.remove('active');
                            if (passiveMode) passiveMode.classList.add('active');
                        };

                        speechSynthesis.cancel();
                        speechSynthesis.speak(speech);
                    }
                } else if (data.error) {
                    if (transcript) transcript.innerText = 'ERROR: ' + (data.error.message || JSON.stringify(data.error));
                } else {
                    if (transcript) transcript.innerText = 'System received empty response.';
                }
            } catch (error) {
                if (transcript) transcript.innerText = 'Connection error: ' + error.message;
            } finally {
                if (!('speechSynthesis' in window)) {
                    if (modeText) modeText.innerText = 'PASSIVE';
                    if (thinkingMode) thinkingMode.classList.remove('active');
                    if (passiveMode) passiveMode.classList.add('active');
                }
            }
        }
    </script>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script src="script.js"></script>

</body>

</html>
