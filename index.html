<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="interface">

        <!-- LEFT STATUS -->
        <section class="left-panel">

            <div class="panel-title">
                SYSTEM STATUS
            </div>

            <div class="current-status">
                <span class="status-dot"></span>
                <span id="modeText">PASSIVE</span>
            </div>

            <div class="mode-list">

                <div id="passiveMode" class="mode active">
                    PASSIVE
                </div>

                <div id="listeningMode" class="mode">
                    LISTENING
                </div>

                <div id="thinkingMode" class="mode">
                    THINKING
                </div>

                <div id="speakingMode" class="mode">
                    SPEAKING
                </div>

            </div>

            <div class="system-info">

                <div>
                    MICROPHONE
                    <span>ACTIVE</span>
                </div>

                <div>
                    CORE
                    <span>ONLINE</span>
                </div>

                <div>
                    AI
                    <span>ONLINE</span>
                </div>

            </div>

        </section>


        <!-- CENTER -->
        <section class="center">

            <canvas id="sphere"></canvas>

            <div class="name">
                J.A.R.V.I.S.
            </div>

            <div id="transcript" class="transcript">
                System ready
            </div>

        </section>


        <!-- RIGHT AI ACTIVITY -->
        <section class="right-panel">

            <div class="panel-title">
                AI ACTIVITY
            </div>

            <div id="activity"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
