<!DOCTYPE html>
<html lang="en">
<!-- Firebase SDKs for Cloud Memory Sync -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="interface">

        <!-- LEFT STATUS -->
        <section class="left-panel">

            <div class="panel-title">
                SYSTEM STATUS
            </div>

            <div class="current-status">
                <span class="status-dot"></span>
                <span id="modeText">PASSIVE</span>
            </div>

            <div class="mode-list">

                <div id="passiveMode" class="mode active">
                    PASSIVE
                </div>

                <div id="listeningMode" class="mode">
                    LISTENING
                </div>

                <div id="thinkingMode" class="mode">
                    THINKING
                </div>

                <div id="speakingMode" class="mode">
                    SPEAKING
                </div>

            </div>

            <div class="system-info">

                <div>
                    MICROPHONE
                    <span id="micStatus">ACTIVE</span>
                </div>

                <div>
                    CORE
                    <span>ONLINE</span>
                </div>

                <div>
                    AI
                    <span>ONLINE</span>
                </div>

            </div>

        </section>


        <!-- CENTER -->
        <section class="center">

            <canvas id="sphere"></canvas>

            <div class="name">
                J.A.R.V.I.S.
            </div>

            <div id="transcript" class="transcript">
                System ready
            </div>

        </section>


        <!-- RIGHT AI ACTIVITY -->
        <section class="right-panel">

            <div class="panel-title">
                AI ACTIVITY
            </div>

            <div id="activity"></div>

        </section>

    </main>


    <script src="script.js"></script>


    <!-- CLOUDFLARE AI CONNECTION -->
    <script>

        async function sendToAI(promptText) {

            const transcript = document.getElementById('transcript');
            const activity = document.getElementById('activity');

            const modeText = document.getElementById('modeText');
            const passiveMode = document.getElementById('passiveMode');
            const thinkingMode = document.getElementById('thinkingMode');

            if (!promptText || !promptText.trim()) return;

            // THINKING MODE
            if (modeText) modeText.innerText = 'THINKING';

            if (passiveMode)
                passiveMode.classList.remove('active');

            if (thinkingMode)
                thinkingMode.classList.add('active');

            if (transcript)
                transcript.innerText = 'Processing command...';

            // Add command to activity
            if (activity) {

                const newLog = document.createElement('div');

                newLog.style.marginBottom = '8px';

                newLog.innerText = '> ' + promptText;

                activity.prepend(newLog);
            }

            try {

                const response = await fetch(
                    'https://jrv.marcbejjani456.workers.dev/',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            prompt: promptText
                        })
                    }
                );

                const data = await response.json();

                if (
                    data.candidates &&
                    data.candidates[0]?.content?.parts[0]?.text
                ) {

                    const aiText =
                        data.candidates[0].content.parts[0].text;

                    if (transcript)
                        transcript.innerText = aiText;

                    // SPEAK RESPONSE
                    if ('speechSynthesis' in window) {

                        const speech =
                            new SpeechSynthesisUtterance(aiText);

                        speech.rate = 1;
                        speech.pitch = 1;

                        speech.onstart = function () {

                            if (modeText)
                                modeText.innerText = 'SPEAKING';
                        };

                        speech.onend = function () {

                            if (modeText)
                                modeText.innerText = 'PASSIVE';

                            if (thinkingMode)
                                thinkingMode.classList.remove('active');

                            if (passiveMode)
                                passiveMode.classList.add('active');
                        };

                        speechSynthesis.cancel();

                        speechSynthesis.speak(speech);

                    }

                }

                else if (data.error) {

                    if (transcript)
                        transcript.innerText =
                            'ERROR: ' +
                            (data.error.message ||
                             JSON.stringify(data.error));

                }

                else {

                    if (transcript)
                        transcript.innerText =
                            'System received empty response.';

                }

            }

            catch (error) {

                if (transcript)
                    transcript.innerText =
                        'Connection error: ' + error.message;

            }

            finally {

                if (!('speechSynthesis' in window)) {

                    if (modeText)
                        modeText.innerText = 'PASSIVE';

                    if (thinkingMode)
                        thinkingMode.classList.remove('active');

                    if (passiveMode)
                        passiveMode.classList.add('active');
                }

            }

        }

    </script>

</body>
<!-- GROQ API SETUP OVERLAY -->
<div id="apiModal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:9999;">
  <div style="background:#001525; border:1px solid #00cfff; padding:25px; border-radius:8px; width:320px; text-align:center;">
    <h3 style="color:#00cfff; margin-bottom:15px; font-size:14px; letter-spacing:2px;">GROQ API KEY</h3>
    <p style="font-size:11px; color:#aaa; margin-bottom:15px;">Enter your free Groq API key (starts with gsk_):</p>
    <input type="password" id="groqKeyInput" placeholder="gsk_..." style="width:100%; padding:8px; margin-bottom:15px; background:#000; border:1px solid #00cfff; color:#fff; border-radius:4px;">
    <button onclick="saveGroqKey()" style="padding:8px 20px; background:#00cfff; color:#000; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">SAVE KEY</button>
  </div>
</div>

</html>
