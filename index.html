<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="interface">

        <!-- LEFT STATUS -->
        <section class="left-panel">

            <div class="panel-title">
                SYSTEM STATUS
            </div>

            <div class="current-status">
                <span class="status-dot"></span>
                <span id="modeText">PASSIVE</span>
            </div>

            <div class="mode-list">

                <div id="passiveMode" class="mode active">
                    PASSIVE
                </div>

                <div id="listeningMode" class="mode">
                    LISTENING
                </div>

                <div id="thinkingMode" class="mode">
                    THINKING
                </div>

                <div id="speakingMode" class="mode">
                    SPEAKING
                </div>

            </div>

            <div class="system-info">

                <div>
                    MICROPHONE
                    <span>ACTIVE</span>
                </div>

                <div>
                    CORE
                    <span>ONLINE</span>
                </div>

                <div>
                    AI
                    <span>ONLINE</span>
                </div>

            </div>

        </section>


        <!-- CENTER -->
        <section class="center">

            <canvas id="sphere"></canvas>

            <div class="name">
                J.A.R.V.I.S.
            </div>

            <div id="transcript" class="transcript">
                System ready
            </div>

            <!-- AI INPUT CONTROL -->
            <div class="ai-input-container" style="margin-top: 15px; display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 400px;">
                <input type="text" id="userInput" placeholder="Enter command or query..." style="flex: 1; padding: 8px 12px; background: rgba(0,0,0,0.5); border: 1px solid #00d2ff; color: #fff; border-radius: 4px; outline: none;">
                <button id="sendBtn" onclick="sendPrompt()" style="padding: 8px 16px; background: #00d2ff; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">SEND</button>
            </div>

        </section>


        <!-- RIGHT AI ACTIVITY -->
        <section class="right-panel">

            <div class="panel-title">
                AI ACTIVITY
            </div>

            <div id="activity"></div>

        </section>

    </main>


    <script src="script.js"></script>

    <!-- CLOUDFLARE WORKER INTEGRATION SCRIPT -->
    <script>
        async function sendPrompt() {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const transcript = document.getElementById('transcript');
            const activity = document.getElementById('activity');

            // UI Mode Elements
            const modeText = document.getElementById('modeText');
            const passiveMode = document.getElementById('passiveMode');
            const thinkingMode = document.getElementById('thinkingMode');

            const promptText = userInput.value.trim();
            if (!promptText) return;

            // Set UI state to THINKING
            sendBtn.disabled = true;
            if (modeText) modeText.innerText = 'THINKING';
            if (passiveMode) passiveMode.classList.remove('active');
            if (thinkingMode) thinkingMode.classList.add('active');

            if (transcript) transcript.innerText = 'Processing command...';

            try {
                // Call your Cloudflare Worker endpoint
                const response = await fetch('https://jrv.marcbejjani456.workers.dev/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: promptText }),
                });

                const data = await response.json();

                // Check for valid response text from Gemini
                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    if (transcript) transcript.innerText = aiText;

                    // Log activity inside the right panel
                    if (activity) {
                        const newLog = document.createElement('div');
                        newLog.style.marginBottom = '8px';
                        newLog.innerText = '> ' + promptText;
                        activity.prepend(newLog);
                    }
                    userInput.value = '';
                } else if (data.error) {
                    if (transcript) transcript.innerText = 'ERROR: ' + (data.error.message || JSON.stringify(data.error));
                } else {
                    if (transcript) transcript.innerText = 'System received empty response.';
                }
            } catch (error) {
                if (transcript) transcript.innerText = 'Connection error: ' + error.message;
            } finally {
                // Restore UI state to PASSIVE
                sendBtn.disabled = false;
                if (modeText) modeText.innerText = 'PASSIVE';
                if (thinkingMode) thinkingMode.classList.remove('active');
                if (passiveMode) passiveMode.classList.add('active');
            }
        }

        // Allow pressing Enter key to send prompt
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendPrompt();
            }
        });
    </script>

</body>

</html>
